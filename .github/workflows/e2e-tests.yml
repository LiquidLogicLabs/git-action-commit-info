name: Tests - E2E

on:
  workflow_call:  # Called by release workflow
  workflow_dispatch:  # Manual trigger only

concurrency:
  group: ${{ github.workflow || 'E2E Tests' }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Runs for workflow_call/workflow_dispatch; tag pushes are not used here
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false
          fetch-depth: 0  # Full history needed for offsets

      - name: Test - Get HEAD commit info (offset 0)
        id: test-head
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          offset: '0'
          verbose: 'false'

      - name: Verify HEAD commit outputs
        env:
          Z_TEST_HEAD_OUTPUTS_SHA: ${{ steps.test-head.outputs.sha }}
          Z_TEST_HEAD_OUTPUTS_SHORT_SHA: ${{ steps.test-head.outputs.short-sha }}
          Z_TEST_HEAD_OUTPUTS_MESSAGE: ${{ steps.test-head.outputs.message }}
          Z_TEST_HEAD_OUTPUTS_MESSAGE_RAW: ${{ steps.test-head.outputs.message-raw }}
          Z_TEST_HEAD_OUTPUTS_AUTHOR: ${{ steps.test-head.outputs.author }}
          Z_TEST_HEAD_OUTPUTS_AUTHOR_EMAIL: ${{ steps.test-head.outputs.author-email }}
          Z_TEST_HEAD_OUTPUTS_DATE: ${{ steps.test-head.outputs.date }}
          Z_TEST_HEAD_OUTPUTS_DATE_ISO: ${{ steps.test-head.outputs.date-iso }}
        run: |
          SHA="${Z_TEST_HEAD_OUTPUTS_SHA}"
          SHORT_SHA="${Z_TEST_HEAD_OUTPUTS_SHORT_SHA}"
          
          if [ -z "$SHA" ]; then
            echo "❌ SHA output is empty"
            exit 1
          fi
          if [ ${#SHA} -ne 40 ]; then
            echo "❌ SHA should be 40 characters, got ${#SHA}"
            exit 1
          fi
          if [ -z "$SHORT_SHA" ]; then
            echo "❌ Short SHA output is empty"
            exit 1
          fi
          if [ ${#SHORT_SHA} -ne 7 ]; then
            echo "❌ Short SHA should be 7 characters, got ${#SHORT_SHA}"
            exit 1
          fi
          if [ -z "${Z_TEST_HEAD_OUTPUTS_MESSAGE}" ]; then
            echo "❌ Message output is empty"
            exit 1
          fi
          if [ -z "${Z_TEST_HEAD_OUTPUTS_MESSAGE_RAW}" ]; then
            echo "❌ MessageRaw output is empty"
            exit 1
          fi
          if [ -z "${Z_TEST_HEAD_OUTPUTS_AUTHOR}" ]; then
            echo "❌ Author output is empty"
            exit 1
          fi
          if [ -z "${Z_TEST_HEAD_OUTPUTS_AUTHOR_EMAIL}" ]; then
            echo "❌ Author email output is empty"
            exit 1
          fi
          if [ -z "${Z_TEST_HEAD_OUTPUTS_DATE}" ]; then
            echo "❌ Date output is empty"
            exit 1
          fi
          if [ -z "${Z_TEST_HEAD_OUTPUTS_DATE_ISO}" ]; then
            echo "❌ Date ISO output is empty"
            exit 1
          fi
          echo "✅ All HEAD commit outputs are valid"

      - name: Test - Get previous commit info (offset 1)
        id: test-head-1
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          offset: '1'
          verbose: 'false'

      - name: Verify HEAD~1 commit outputs
        env:
          Z_TEST_HEAD_1_OUTPUTS_SHA: ${{ steps.test-head-1.outputs.sha }}
          Z_TEST_HEAD_OUTPUTS_SHA: ${{ steps.test-head.outputs.sha }}
        run: |
          SHA="${Z_TEST_HEAD_1_OUTPUTS_SHA}"
          
          if [ -z "$SHA" ]; then
            echo "❌ SHA output is empty"
            exit 1
          fi
          if [ ${#SHA} -ne 40 ]; then
            echo "❌ SHA should be 40 characters, got ${#SHA}"
            exit 1
          fi
          # Verify it's different from HEAD
          if [ "${Z_TEST_HEAD_OUTPUTS_SHA}" == "${Z_TEST_HEAD_1_OUTPUTS_SHA}" ]; then
            echo "❌ HEAD~1 SHA should be different from HEAD SHA"
            exit 1
          fi
          echo "✅ HEAD~1 commit outputs are valid and different from HEAD"

      - name: Test - Default offset (should default to 0)
        id: test-default
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          verbose: 'false'

      - name: Verify default offset equals HEAD
        env:
          Z_TEST_HEAD_OUTPUTS_SHA: ${{ steps.test-head.outputs.sha }}
          Z_TEST_DEFAULT_OUTPUTS_SHA: ${{ steps.test-default.outputs.sha }}
        run: |
          if [ "${Z_TEST_HEAD_OUTPUTS_SHA}" != "${Z_TEST_DEFAULT_OUTPUTS_SHA}" ]; then
            echo "❌ Default offset should equal HEAD (offset 0)"
            exit 1
          fi
          echo "✅ Default offset correctly defaults to 0 (HEAD)"

      - name: Test - Verbose logging
        id: test-verbose
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          offset: '0'
          verbose: 'true'

      - name: Verify verbose mode works
        env:
          Z_TEST_VERBOSE_OUTPUTS_SHA: ${{ steps.test-verbose.outputs.sha }}
        run: |
          if [ -z "${Z_TEST_VERBOSE_OUTPUTS_SHA}" ]; then
            echo "❌ Verbose mode should still produce outputs"
            exit 1
          fi
          echo "✅ Verbose mode works correctly"

      - name: Test Summary
        run: |
          {
            echo "## ✅ E2E Tests Complete"
            echo ""
            echo "All E2E tests passed successfully!"
            echo ""
            echo "### Test Scenarios:"
            echo "- ✅ HEAD commit info (offset 0)"
            echo "- ✅ Previous commit info (offset 1)"
            echo "- ✅ Default offset behavior"
            echo "- ✅ Verbose logging mode"
          } >> "$GITHUB_STEP_SUMMARY"
